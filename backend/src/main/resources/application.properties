spring.application.name=DuckPlanner

# Conexao com o PostgreSQL (valores vem das variaveis do docker-compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:duckplanner}
spring.datasource.username=${DB_USER:duck}
spring.datasource.password=${DB_PASSWORD:duck123}

# As tabelas sao criadas pelo database/init.sql, o Hibernate nao mexe no banco
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.port=8080
server.error.include-message=always
