server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Tudo que o site pedir em /api vai para o container do back-end
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
