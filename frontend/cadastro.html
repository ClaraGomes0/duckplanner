<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | StudyFlow</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <header class="cabecalho">

        <a href="index.html" class="logo">✦ StudyFlow</a>

        <a href="index.html" class="voltar">Voltar ao início</a>

    </header>

    <main class="container">

        <section class="card-cadastro">

            <div class="icone">📚</div>

            <h1>Crie sua conta!</h1>

            <p class="descricao">
                Comece a organizar seus estudos
                e construa uma rotina melhor.
            </p>

            <form id="formCadastro">

                <label for="nome">Nome completo</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required
                >

                <label for="confirmarSenha">Confirmar senha</label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite sua senha novamente"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Criar minha conta →
                </button>

            </form>

            <p class="login">
                Já possui uma conta?

                <a href="login.html">Entrar</a>
            </p>

        </section>

    </main>

    <footer>
        © 2026 StudyFlow. Todos os direitos reservados.
    </footer>

    <script>

        document.getElementById("formCadastro")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const nome = document.getElementById("nome").value.trim();

                const email = document.getElementById("email").value.trim();

                const senha = document.getElementById("senha").value;

                const confirmarSenha = document.getElementById("confirmarSenha").value;

                if (senha !== confirmarSenha) {

                    alert("As senhas não são iguais!");

                    return;

                }

                const estudante = {
                    nome: nome,
                    email: email
                };

                localStorage.setItem(
                    "estudante",
                    JSON.stringify(estudante)
                );

                localStorage.setItem("senhaEstudante", senha);

                window.location.href = "painel.html";

            });

    </script>

</body>
</html>
