<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | StudyFlow</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="topo">
        <a href="index.html" class="logo">✦ StudyFlow</a>
        <a href="index.html" class="voltar">Voltar ao início</a>
    </header>

    <main class="container">

        <section class="card-login">

            <div class="icone">✦</div>

            <h1>Bem-vindo de volta!</h1>
            <p class="subtitulo">
                Entre na sua conta para continuar organizando seus estudos.
            </p>

            <form id="formLogin">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="botao-entrar">
                    Entrar
                </button>

            </form>

            <p class="cadastro">
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>

    </main>

    <script>
        const formulario = document.getElementById("formLogin");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            const estudante = JSON.parse(localStorage.getItem("estudante"));
            const senhaCadastrada = localStorage.getItem("senhaEstudante");

            if (!estudante || !senhaCadastrada) {
                alert("Você ainda não possui uma conta. Faça seu cadastro!");
                return;
            }

            if (email === estudante.email && senha === senhaCadastrada) {
                localStorage.setItem("usuarioLogado", "true");
                window.location.href = "painel.html";
            } else {
                alert("E-mail ou senha incorretos!");
            }
        });
    </script>

</body>
</html>
