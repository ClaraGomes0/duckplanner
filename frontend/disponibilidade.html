<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disponibilidade | StudyFlow</title>
    <link rel="stylesheet" href="disponibilidade.css">
</head>

<body>

    <header class="topo">
        <h1>Study<span>Flow</span></h1>

        <nav>
            <a href="painel.html">Início</a>
            <a href="materias.html">Matérias</a>
            <a href="disponibilidade.html" class="ativo">Disponibilidade</a>
            <a href="cronograma.html">Cronograma</a>
        </nav>

        <button class="voltar" onclick="window.location.href='painel.html'">
            Voltar
        </button>
    </header>

    <main class="container">

        <section class="cabecalho">
            <h2>Minha disponibilidade 🕒</h2>
            <p>Informe os dias e horários em que você pode estudar.</p>
        </section>

        <section class="formulario">

            <h3>Organize seus horários</h3>

            <form id="formDisponibilidade">

                <div class="campo">
                    <label for="dia">Dia da semana</label>

                    <select id="dia" required>
                        <option value="">Selecione um dia</option>
                        <option value="Segunda-feira">Segunda-feira</option>
                        <option value="Terça-feira">Terça-feira</option>
                        <option value="Quarta-feira">Quarta-feira</option>
                        <option value="Quinta-feira">Quinta-feira</option>
                        <option value="Sexta-feira">Sexta-feira</option>
                        <option value="Sábado">Sábado</option>
                        <option value="Domingo">Domingo</option>
                    </select>
                </div>

                <div class="horarios">

                    <div class="campo">
                        <label for="inicio">Horário inicial</label>
                        <input type="time" id="inicio" required>
                    </div>

                    <div class="campo">
                        <label for="fim">Horário final</label>
                        <input type="time" id="fim" required>
                    </div>

                </div>

                <button type="submit" class="adicionar">
                    + Adicionar horário
                </button>

            </form>

        </section>

        <section class="lista">

            <div class="titulo-lista">
                <h3>Meus horários disponíveis</h3>
                <span id="quantidade">0 horários</span>
            </div>

            <div id="listaDisponibilidade">
                <p class="vazio">Nenhum horário cadastrado ainda.</p>
            </div>

        </section>

        <div class="acoes">
            <button class="anterior" onclick="window.location.href='materias.html'">
                ← Voltar
            </button>

            <button class="continuar" onclick="window.location.href='cronograma.html'">
                Criar cronograma →
            </button>
        </div>

    </main>

    <footer>
        <p>© 2026 StudyFlow - Organize seus estudos, alcance seus objetivos.</p>
    </footer>

    <script src="api.js"></script>
    <script src="disponibilidade.js"></script>

</body>
</html>
