<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matérias | StudyFlow</title>
    <link rel="stylesheet" href="materias.css">
</head>

<body>

    <header class="topo">
        <h1>Study<span>Flow</span></h1>

        <nav>
            <a href="painel.html">Início</a>
            <a href="materias.html" class="ativo">Matérias</a>
            <a href="disponibilidade.html">Disponibilidade</a>
            <a href="cronograma.html">Cronograma</a>
        </nav>

        <button class="voltar" onclick="window.location.href='painel.html'">
            Voltar
        </button>
    </header>

    <main class="container">

        <section class="cabecalho">
            <h2>Minhas matérias 📚</h2>
            <p>Adicione suas disciplinas e organize suas prioridades de estudo.</p>
        </section>

        <section class="formulario">

            <h3>Adicionar nova matéria</h3>

            <form id="formMateria">

                <div class="campo">
                    <label for="nomeMateria">Nome da matéria</label>
                    <input
                        type="text"
                        id="nomeMateria"
                        placeholder="Ex: Matemática"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="dificuldade">Nível de dificuldade</label>

                    <select id="dificuldade" required>
                        <option value="">Selecione</option>
                        <option value="1">1 - Muito fácil</option>
                        <option value="2">2 - Fácil</option>
                        <option value="3">3 - Médio</option>
                        <option value="4">4 - Difícil</option>
                        <option value="5">5 - Muito difícil</option>
                    </select>
                </div>

                <button type="submit" class="adicionar">
                    + Adicionar matéria
                </button>

            </form>

        </section>

        <section class="lista">

            <div class="titulo-lista">
                <h3>Minhas disciplinas</h3>
                <span id="quantidade">0 matérias</span>
            </div>

            <div id="listaMaterias" class="materias">
                <p class="vazio">Nenhuma matéria adicionada ainda.</p>
            </div>

        </section>

        <div class="continuar">
            <button onclick="window.location.href='disponibilidade.html'">
                Continuar →
            </button>
        </div>

    </main>

    <footer>
        <p>© 2026 StudyFlow - Organize seus estudos, alcance seus objetivos.</p>
    </footer>

    <script src="api.js"></script>
    <script src="materias.js"></script>

</body>
</html>
